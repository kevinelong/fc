openapi: 3.1.0
info:
  title: TPOS API
  version: "1.0.0"
  description: >
    REST/JSON API for TPOS, the trailer-dealer SaaS. Namespaces: /api/v1 (authenticated
    back office, tenant-scoped), /api/v1/portal (customer portal), /api/public (storefront,
    no auth, tenant by Host), /api/platform (operator control plane), /api/webhooks (inbound).
    State changes use explicit action endpoints (…/transition, …/approve) so they are
    validated and audited. Money/transition writes accept an Idempotency-Key header.
servers:
  - url: https://{tenant}.tpos.app
    variables: { tenant: { default: demo } }
  - url: https://api.tpos.app
security:
  - cookieAuth: []
tags:
  - { name: auth }
  - { name: inventory }
  - { name: pricing }
  - { name: leads }
  - { name: customers }
  - { name: deals }
  - { name: service }
  - { name: accounting }
  - { name: titles-delivery }
  - { name: rentals }
  - { name: crosscut }
  - { name: import }
  - { name: realtime }
  - { name: storefront }
  - { name: portal }
  - { name: platform }
  - { name: webhooks }
paths:
  /api/v1/auth/login:   { post: { tags: [auth], summary: Log in, responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/v1/auth/logout:  { post: { tags: [auth], summary: Log out, responses: { "204": { description: No Content } } } }
  /api/v1/auth/me:      { get:  { tags: [auth], summary: Current user, responses: { "200": { $ref: '#/components/responses/User' } } } }

  /api/v1/units:
    get:  { tags: [inventory], summary: List/filter inventory, parameters: [ {$ref: '#/components/parameters/q'}, {$ref: '#/components/parameters/page'}, { name: status, in: query, schema: { $ref: '#/components/schemas/UnitStatus' } } ], responses: { "200": { $ref: '#/components/responses/UnitList' } } }
    post: { tags: [inventory], summary: Intake / acquire a unit, requestBody: { $ref: '#/components/requestBodies/Unit' }, responses: { "201": { $ref: '#/components/responses/Unit' } } }
  /api/v1/units/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:   { tags: [inventory], summary: Full unit record, responses: { "200": { $ref: '#/components/responses/Unit' } } }
    patch: { tags: [inventory], summary: Edit specs, requestBody: { $ref: '#/components/requestBodies/Unit' }, responses: { "200": { $ref: '#/components/responses/Unit' } } }
  /api/v1/units/{id}/transition:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    post: { tags: [inventory], summary: Change status (incoming→recon→available→pending→sold), parameters: [ { $ref: '#/components/parameters/idem' } ], requestBody: { content: { application/json: { schema: { type: object, properties: { to: { $ref: '#/components/schemas/UnitStatus' } }, required: [to] } } } }, responses: { "200": { $ref: '#/components/responses/Unit' } } }
  /api/v1/units/{id}/photos:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    post:
      tags: [inventory]
      summary: Upload photo (validated by magic bytes, re-encoded, stored in object storage)
      requestBody:
        content:
          multipart/form-data:
            schema: { type: object, properties: { file: { type: string, format: binary }, is_cover: { type: boolean } }, required: [file] }
      responses: { "201": { $ref: '#/components/responses/Ok' } }
  /api/v1/units/{id}/timeline: { parameters: [ { $ref: '#/components/parameters/id' } ], get: { tags: [inventory], summary: Activity/audit for this unit, responses: { "200": { $ref: '#/components/responses/ActivityList' } } } }
  /api/v1/units/aging: { get: { tags: [inventory], summary: Aging report, responses: { "200": { $ref: '#/components/responses/UnitList' } } } }

  /api/v1/units/{id}/price: { parameters: [ { $ref: '#/components/parameters/id' } ], patch: { tags: [pricing], summary: Set list/floor (logged; may need approval), requestBody: { content: { application/json: { schema: { type: object, properties: { list_price: { type: number }, floor_price: { type: number }, reason: { type: string } } } } } }, responses: { "200": { $ref: '#/components/responses/Unit' } } } }
  /api/v1/pricing/repricer: { get: { tags: [pricing], summary: Repricer table + suggestions, responses: { "200": { $ref: '#/components/responses/UnitList' } } } }
  /api/v1/pricing/comps: { get: { tags: [pricing], summary: Market comparables, parameters: [ { name: unit, in: query, schema: { type: string } } ], responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/v1/pricing/approvals/{id}/decide: { parameters: [ { $ref: '#/components/parameters/id' } ], post: { tags: [pricing], summary: Approve/deny a price change, responses: { "200": { $ref: '#/components/responses/Ok' } } } }

  /api/v1/leads:
    get:  { tags: [leads], summary: List leads, parameters: [ {$ref: '#/components/parameters/q'} ], responses: { "200": { $ref: '#/components/responses/LeadList' } } }
    post: { tags: [leads], summary: Create lead, responses: { "201": { $ref: '#/components/responses/Lead' } } }
  /api/v1/leads/{id}: { parameters: [ { $ref: '#/components/parameters/id' } ], get: { tags: [leads], summary: Get lead, responses: { "200": { $ref: '#/components/responses/Lead' } } }, patch: { tags: [leads], summary: Update lead, responses: { "200": { $ref: '#/components/responses/Lead' } } } }
  /api/v1/leads/{id}/assign:  { parameters: [ { $ref: '#/components/parameters/id' } ], post: { tags: [leads], summary: Route to a salesperson, responses: { "200": { $ref: '#/components/responses/Lead' } } } }
  /api/v1/leads/{id}/convert: { parameters: [ { $ref: '#/components/parameters/id' } ], post: { tags: [leads], summary: Convert lead to deal, responses: { "201": { $ref: '#/components/responses/Deal' } } } }

  /api/v1/customers: { get: { tags: [customers], summary: List customers, responses: { "200": { $ref: '#/components/responses/Ok' } } }, post: { tags: [customers], summary: Create customer, responses: { "201": { $ref: '#/components/responses/Ok' } } } }
  /api/v1/deals:
    get:  { tags: [deals], summary: List deals (pipeline), responses: { "200": { $ref: '#/components/responses/DealList' } } }
    post: { tags: [deals], summary: Create deal, responses: { "201": { $ref: '#/components/responses/Deal' } } }
  /api/v1/deals/{id}/stage:    { parameters: [ { $ref: '#/components/parameters/id' } ], post: { tags: [deals], summary: Advance pipeline stage, responses: { "200": { $ref: '#/components/responses/Deal' } } } }
  /api/v1/deals/{id}/discount: { parameters: [ { $ref: '#/components/parameters/id' } ], post: { tags: [deals], summary: Request below-floor discount, responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/v1/deals/{id}/approve:  { parameters: [ { $ref: '#/components/parameters/id' } ], post: { tags: [deals], summary: Manager approve/deny/counter (RBAC), responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/v1/quotes: { post: { tags: [deals], summary: Create quote, responses: { "201": { $ref: '#/components/responses/Ok' } } } }
  /api/v1/forecast: { get: { tags: [deals], summary: Weighted pipeline forecast, responses: { "200": { $ref: '#/components/responses/Ok' } } } }

  /api/v1/workorders:
    get:  { tags: [service], summary: List work orders, responses: { "200": { $ref: '#/components/responses/Ok' } } }
    post: { tags: [service], summary: Open a work order, responses: { "201": { $ref: '#/components/responses/Ok' } } }
  /api/v1/workorders/{id}/status: { parameters: [ { $ref: '#/components/parameters/id' } ], post: { tags: [service], summary: Change WO status, responses: { "200": { $ref: '#/components/responses/Ok' } } } }

  /api/v1/rentals:
    get:  { tags: [rentals], summary: List rental agreements (status, due-back, overdue filters), parameters: [ {$ref: '#/components/parameters/q'}, {$ref: '#/components/parameters/page'} ], responses: { "200": { $ref: '#/components/responses/Ok' } } }
    post: { tags: [rentals], summary: Create a reservation (conflict-checked against the unit's calendar), parameters: [ { $ref: '#/components/parameters/idem' } ], responses: { "201": { $ref: '#/components/responses/Ok' } } }
  /api/v1/rentals/availability: { get: { tags: [rentals], summary: Availability calendar, parameters: [ { name: type, in: query, schema: { type: string } }, { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } } ], responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/v1/rentals/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:   { tags: [rentals], summary: Full agreement (rates, deposit, COI/waiver, inspections, billing), responses: { "200": { $ref: '#/components/responses/Ok' } } }
    patch: { tags: [rentals], summary: Edit terms (extension, return lot, RPO), responses: { "200": { $ref: '#/components/responses/Ok' } } }
  /api/v1/rentals/{id}/transition:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    post: { tags: [rentals], summary: "reserved→on_rent (check-out; GATED on credit + valid COI or waiver election)→off_rent→in_inspection→closed; guarded + audited", parameters: [ { $ref: '#/components/parameters/idem' } ], responses: { "200": { $ref: '#/components/responses/Ok' } } }
  /api/v1/rentals/{id}/inspections:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    post:
      tags: [rentals]
      summary: Record a check-out / check-in inspection (meter readings + photos)
      requestBody: { content: { multipart/form-data: { schema: { type: object, properties: { kind: { type: string, enum: [check_out, check_in] }, hub_miles: { type: integer }, checklist: { type: string }, photos: { type: array, items: { type: string, format: binary } } }, required: [kind] } } } }
      responses: { "201": { $ref: '#/components/responses/Ok' } }
  /api/v1/rental-rates:
    get: { tags: [rentals], summary: Rate book (base + seasonal windows), responses: { "200": { $ref: '#/components/responses/Ok' } } }
    put: { tags: [rentals], summary: Update rate book, responses: { "200": { $ref: '#/components/responses/Ok' } } }
  /api/v1/customers/{id}/coi:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:  { tags: [rentals], summary: Certificates of insurance on file (expiry status), responses: { "200": { $ref: '#/components/responses/Ok' } } }
    post: { tags: [rentals], summary: Record a COI (limits, additional-insured/loss-payee, expiry, document), responses: { "201": { $ref: '#/components/responses/Ok' } } }

  /api/v1/invoices:
    get:  { tags: [accounting], summary: List invoices (AR/AP), responses: { "200": { $ref: '#/components/responses/Ok' } } }
    post: { tags: [accounting], summary: Issue invoice, responses: { "201": { $ref: '#/components/responses/Ok' } } }
  /api/v1/invoices/{id}/payments: { parameters: [ { $ref: '#/components/parameters/id' } ], post: { tags: [accounting], summary: Record a payment (idempotent), parameters: [ { $ref: '#/components/parameters/idem' } ], responses: { "201": { $ref: '#/components/responses/Ok' } } } }
  /api/v1/accounting/pnl: { get: { tags: [accounting], summary: P&L for a period, parameters: [ { name: period, in: query, schema: { type: string } } ], responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/v1/accounting/mapping:
    get: { tags: [accounting], summary: GL account mapping (system buckets → dealer's chart of accounts), responses: { "200": { $ref: '#/components/responses/Ok' } } }
    put: { tags: [accounting], summary: Save GL account mapping (one-time wizard), responses: { "200": { $ref: '#/components/responses/Ok' } } }
  /api/v1/accounting/exports:
    get:  { tags: [accounting], summary: List export batches (what was exported, when, to which target), responses: { "200": { $ref: '#/components/responses/Ok' } } }
    post: { tags: [accounting], summary: Create an export batch (target = quickbooks_csv | quickbooks_iif | …); marks records exported, returns a file; idempotent, parameters: [ { $ref: '#/components/parameters/idem' } ], responses: { "201": { $ref: '#/components/responses/Ok' } } }
  /api/v1/accounting/exports/{id}/file:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [accounting]
      summary: Download an export batch file
      responses:
        "200":
          description: The export file in the batch's target format
          content:
            text/csv:    { schema: { type: string }, example: "date,account,debit,credit,memo" }
            text/plain:  { schema: { type: string }, example: "!TRNS\tTRNSTYPE\tDATE\tACCNT… (QuickBooks IIF, tab-delimited)" }

  /api/v1/titles/{unitId}:  { parameters: [ { name: unitId, in: path, required: true, schema: { type: string } } ], get: { tags: [titles-delivery], summary: Title/DMV status, responses: { "200": { $ref: '#/components/responses/Ok' } }, patch: { tags: [titles-delivery], summary: Update title status, responses: { "200": { $ref: '#/components/responses/Ok' } } } } }
  /api/v1/documents/{id}/sign: { parameters: [ { $ref: '#/components/parameters/id' } ], post: { tags: [titles-delivery], summary: e-sign a document, responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/v1/deliveries:
    get:  { tags: [titles-delivery], summary: Load board, responses: { "200": { $ref: '#/components/responses/Ok' } } }
    post: { tags: [titles-delivery], summary: Schedule a delivery, responses: { "201": { $ref: '#/components/responses/Ok' } } }
  /api/v1/deliveries/{id}/status: { parameters: [ { $ref: '#/components/parameters/id' } ], post: { tags: [titles-delivery], summary: Update delivery status, responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/v1/deliveries/quote: { post: { tags: [titles-delivery], summary: Freight rate by lane, responses: { "200": { $ref: '#/components/responses/Ok' } } } }

  /api/v1/search: { get: { tags: [crosscut], summary: Global search (tenant- & permission-scoped), parameters: [ {$ref: '#/components/parameters/q'} ], responses: { "200": { $ref: '#/components/responses/Ok' } } } }

  /api/v1/bulk/{entity}:
    parameters: [ { name: entity, in: path, required: true, schema: { type: string, enum: [units, customers, leads, deals] } } ]
    post:
      tags: [import]
      summary: Bulk upsert keyed on external_ref (create if new, update if seen) — idempotent re-runs never duplicate
      parameters: [ { $ref: '#/components/parameters/idem' } ]
      responses: { "200": { $ref: '#/components/responses/Ok' } }
  /api/v1/imports:
    get:  { tags: [import], summary: List import jobs, responses: { "200": { $ref: '#/components/responses/Ok' } } }
    post:
      tags: [import]
      summary: Start an import job (upload → map → validate → commit); async with an import id
      requestBody:
        content:
          multipart/form-data:
            schema: { type: object, properties: { file: { type: string, format: binary }, entity: { type: string, enum: [units, customers, leads, deals] }, mapping_profile: { type: string } }, required: [file, entity] }
      responses: { "202": { $ref: '#/components/responses/Ok' } }
  /api/v1/imports/{id}: { parameters: [ { $ref: '#/components/parameters/id' } ], get: { tags: [import], summary: "Import job status: counts, row-level errors vs warnings, annotated error report", responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/v1/imports/{id}/errors.csv:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [import]
      summary: Downloadable annotated error rows for fix-and-reupload
      responses:
        "200": { description: Failed rows with reasons, content: { text/csv: { schema: { type: string } } } }

  /api/v1/events:
    get:
      tags: [realtime]
      summary: Real-time change feed (server push; SSE or upgraded WebSocket) — tenant-scoped topics; no client polling
      description: >
        The stream itself (transports, message schemas, resume semantics) is contract-defined in
        the companion **asyncapi.yaml** — this entry documents only the HTTP entry point.
      parameters: [ { name: topics, in: query, schema: { type: string }, description: "Comma-separated: units, leads, deals, invoices, deliveries, rentals, notifications" }, { name: cursor, in: query, schema: { type: string }, description: Resume after a missed window } ]
      responses: { "200": { description: "text/event-stream of {topic, entity_type, entity_id, action, at} events" } }
  /api/v1/reports/{kpiSet}: { parameters: [ { name: kpiSet, in: path, required: true, schema: { type: string, enum: [sales, inventory, money, marketing, service, rentals] } } ], get: { tags: [crosscut], summary: Dashboard KPI bundle, responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/v1/users:
    get:  { tags: [crosscut], summary: List users, responses: { "200": { $ref: '#/components/responses/Ok' } } }
    post: { tags: [crosscut], summary: Invite user, responses: { "201": { $ref: '#/components/responses/User' } } }
  /api/v1/tenant/settings:
    get:   { tags: [crosscut], summary: Tenant settings, responses: { "200": { $ref: '#/components/responses/Ok' } } }
    patch: { tags: [crosscut], summary: Update branding/lots/config, responses: { "200": { $ref: '#/components/responses/Ok' } } }

  /api/public/inventory: { get: { tags: [storefront], summary: Available units (no auth; tenant by Host), security: [], responses: { "200": { $ref: '#/components/responses/UnitList' } } } }
  /api/public/inventory/{stock}: { parameters: [ { name: stock, in: path, required: true, schema: { type: string } } ], get: { tags: [storefront], summary: Listing detail (deep-linkable), security: [], responses: { "200": { $ref: '#/components/responses/Unit' } } } }
  /api/public/inquiry: { post: { tags: [storefront], summary: Submit inquiry -> creates a Lead + notifies (IMPLEMENTED in prototype), security: [], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Inquiry' } } } }, responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/public/financing/prequalify: { post: { tags: [storefront], summary: Soft-pull pre-qualification, security: [], responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/public/rentals: { get: { tags: [storefront], summary: "Rental listings (daily/weekly/monthly rates, availability; no auth, tenant by Host)", security: [], responses: { "200": { $ref: '#/components/responses/Ok' } } } }

  /api/v1/portal/me: { get: { tags: [portal], summary: Customer profile, responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/v1/portal/deals: { get: { tags: [portal], summary: My deals/quotes, responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/v1/portal/financing/apply: { post: { tags: [portal], summary: Apply for financing, responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/v1/portal/delivery/{id}: { parameters: [ { $ref: '#/components/parameters/id' } ], get: { tags: [portal], summary: Delivery tracking, responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/v1/portal/documents: { get: { tags: [portal], summary: My documents, responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/v1/portal/rentals: { get: { tags: [portal], summary: "My rentals (term, charges, due-back, deposit state)", responses: { "200": { $ref: '#/components/responses/Ok' } } } }

  /api/platform/tenants:
    get:  { tags: [platform], summary: List dealerships, responses: { "200": { $ref: '#/components/responses/Ok' } } }
    post: { tags: [platform], summary: Provision a tenant, responses: { "201": { $ref: '#/components/responses/Ok' } } }
  /api/platform/tenants/{id}: { parameters: [ { $ref: '#/components/parameters/id' } ], patch: { tags: [platform], summary: Change plan/status, responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/platform/revenue: { get: { tags: [platform], summary: MRR/ARR/churn, responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/platform/usage: { get: { tags: [platform], summary: Cross-tenant usage metering, responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/platform/health: { get: { tags: [platform], summary: System health, security: [], responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/platform/license/verify: { post: { tags: [platform], summary: Self-host license-key check, security: [], responses: { "200": { $ref: '#/components/responses/Ok' } } } }

  /api/webhooks/financing:   { post: { tags: [webhooks], summary: Lender decision -> Deal/portal, security: [], responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/webhooks/payments:    { post: { tags: [webhooks], summary: Payment settled -> reconcile invoice, security: [], responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/webhooks/freight:     { post: { tags: [webhooks], summary: Carrier status -> delivery, security: [], responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/webhooks/syndication: { post: { tags: [webhooks], summary: Listing-site lead -> create Lead, security: [], responses: { "200": { $ref: '#/components/responses/Ok' } } } }
  /api/webhooks/title:       { post: { tags: [webhooks], summary: DMV/title callback, security: [], responses: { "200": { $ref: '#/components/responses/Ok' } } } }

# Outbound webhooks TPOS emits to a tenant's configured integration endpoints (OpenAPI 3.1).
# Distinct from the inbound /api/webhooks/* paths above (which third parties call INTO TPOS).
# Deliveries are signed (HMAC over body + timestamp header) and retried with backoff.
webhooks:
  unit.status_changed:
    post:
      summary: A unit transitioned (incoming→recon→available→pending→sold)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/OutboundEvent' } } } }
      responses: { "200": { description: Acknowledge with any 2xx } }
  deal.won:
    post:
      summary: A deal was marked won
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/OutboundEvent' } } } }
      responses: { "200": { description: Acknowledge with any 2xx } }
  invoice.paid:
    post:
      summary: An invoice was fully paid
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/OutboundEvent' } } } }
      responses: { "200": { description: Acknowledge with any 2xx } }
  lead.created:
    post:
      summary: A new lead was captured (storefront, syndication or manual)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/OutboundEvent' } } } }
      responses: { "200": { description: Acknowledge with any 2xx } }
  rental.overdue:
    post:
      summary: A rental went past its term without off-rent (holdover billing began)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/OutboundEvent' } } } }
      responses: { "200": { description: Acknowledge with any 2xx } }
  coi.expiring:
    post:
      summary: A customer's certificate of insurance expires within the alert window
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/OutboundEvent' } } } }
      responses: { "200": { description: Acknowledge with any 2xx } }

components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: tpos_session }
    bearer: { type: http, scheme: bearer }
  requestBodies:
    Unit:
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Unit' }
  parameters:
    id:   { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    q:    { name: q, in: query, schema: { type: string }, description: keyword search }
    page: { name: page, in: query, schema: { type: integer, default: 1 } }
    idem: { name: Idempotency-Key, in: header, schema: { type: string } }
  schemas:
    OutboundEvent:
      type: object
      required: [event, entity_type, entity_id, at]
      properties:
        event:       { type: string, description: Webhook name (unit.status_changed, deal.won, ...) }
        entity_type: { type: string }
        entity_id:   { type: string, format: uuid }
        detail:      { type: object, description: Small non-sensitive hints (e.g. from/to) — consumers re-fetch via the API }
        at:          { type: string, format: date-time }
    UnitStatus: { type: string, enum: [incoming, recon, available, pending, sold] }
    DealStage:  { type: string, enum: [lead, quoted, negotiation, financing, delivery, won, lost] }
    Unit:
      type: object
      properties:
        id: { type: string, format: uuid }
        stock_no: { type: string }
        type: { type: string }
        year: { type: integer }
        make: { type: string }
        length: { type: string }
        status: { $ref: '#/components/schemas/UnitStatus' }
        cost: { type: number }
        list_price: { type: number }
        floor_price: { type: number }
        location: { type: string }
        views: { type: integer }
        lead_count: { type: integer }
    Lead:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        company: { type: string }
        source: { type: string }
        interest_unit_id: { type: string }
        status: { type: string, enum: [new, working, quoted, won, lost] }
        owner_id: { type: string }
        value: { type: number }
    Deal:
      type: object
      properties:
        id: { type: string }
        customer: { type: string }
        unit_id: { type: string }
        stage: { $ref: '#/components/schemas/DealStage' }
        value: { type: number }
        probability: { type: integer }
        salesperson_id: { type: string }
    Inquiry:
      type: object
      required: [name]
      properties:
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        subject: { type: string }
        message: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        roles: { type: array, items: { type: string } }
    Error:
      type: object
      properties: { error: { type: string } }
  responses:
    Ok:           { description: Success, content: { application/json: { schema: { type: object } } } }
    Unit:         { description: A unit, content: { application/json: { schema: { $ref: '#/components/schemas/Unit' } } } }
    UnitList:     { description: Units, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Unit' } } } } }
    Lead:         { description: A lead, content: { application/json: { schema: { $ref: '#/components/schemas/Lead' } } } }
    LeadList:     { description: Leads, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Lead' } } } } }
    Deal:         { description: A deal, content: { application/json: { schema: { $ref: '#/components/schemas/Deal' } } } }
    DealList:     { description: Deals, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Deal' } } } } }
    User:         { description: A user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
    ActivityList: { description: Activity entries, content: { application/json: { schema: { type: array, items: { type: object } } } } }
