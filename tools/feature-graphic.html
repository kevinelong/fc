<!doctype html><html><head><meta charset="utf-8">
<style>
  *{margin:0;box-sizing:border-box}html,body{width:1024px;height:500px;overflow:hidden}
  body{background:radial-gradient(120% 130% at 22% 0%,#2a2038 0%,#14110a 58%,#0b0906 100%);
       color:#d8c9a8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:52px 60px;position:relative}
  .logo{font-size:104px;font-weight:800;color:#f0e6cf;letter-spacing:-2px;line-height:1}
  .logo .a{color:#ffec27}
  .tag{font-size:40px;color:#ffec27;font-weight:700;margin-top:10px}
  .sub{font-size:26px;color:#c8a96e;margin-top:12px;max-width:560px;line-height:1.35}
  .mp{display:inline-block;margin-top:20px;font-size:21px;color:#9f9;background:#10240f;border:1px solid #2c6e2c;border-radius:26px;padding:7px 20px}
  .strip{position:absolute;right:48px;top:52px;display:grid;grid-template-columns:132px 132px;grid-gap:14px}
  .strip img{width:132px;height:132px;image-rendering:pixelated;border:2px solid #5a4a28;border-radius:9px;background:#000}
  .url{position:absolute;left:60px;bottom:40px;font-size:24px;color:#8a7340}.url b{color:#c8a96e}
</style></head><body>
  <div class="logo"><span class="a">&#9656;</span> fc</div>
  <div class="tag">games in plain English</div>
  <div class="sub">A fantasy console you code by writing English. Make a game, play it on your phone.</div>
  <div class="mp">&#127918; multiplayer built in</div>
  <div class="strip">
    <img id="i0"><img id="i1"><img id="i2"><img id="i3">
  </div>
  <div class="url">&#9656; <b>codeonline.io</b> &mdash; free, no install</div>
</body></html>
