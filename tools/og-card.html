<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  body { background:radial-gradient(120% 120% at 30% 0%, #241c2e 0%, #14110a 60%, #0b0906 100%);
         color:#d8c9a8; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:62px 70px; position:relative; }
  .logo { font-size:120px; font-weight:800; color:#f0e6cf; letter-spacing:-3px; line-height:1; }
  .logo .arrow { color:#ffec27; }
  .tag { font-size:44px; color:#ffec27; font-weight:700; margin-top:14px; }
  .sub { font-size:30px; color:#c8a96e; margin-top:14px; max-width:760px; line-height:1.35; }
  .mp { display:inline-block; margin-top:22px; font-size:24px; color:#9f9; background:#10240f; border:1px solid #2c6e2c; border-radius:30px; padding:8px 22px; }
  .strip { position:absolute; right:54px; top:70px; display:grid; grid-template-columns:160px 160px; grid-gap:16px; }
  .strip img { width:160px; height:160px; image-rendering:pixelated; border:2px solid #5a4a28; border-radius:10px; background:#000; }
  .url { position:absolute; left:70px; bottom:48px; font-size:30px; color:#8a7340; }
  .url b { color:#c8a96e; }
</style></head>
<body>
  <div class="logo"><span class="arrow">&#9656;</span> fc</div>
  <div class="tag">games in plain English</div>
  <div class="sub">A fantasy console you code by writing English. Make a game, play it on your phone &mdash; multiplayer built in.</div>
  <div class="mp">&#127918; two players, two phones, no install</div>
  <div class="strip">
    <img src="../examples/thumbs/cycles.png">
    <img src="../examples/thumbs/coin-quest.png">
    <img src="../examples/thumbs/bubble-pop.png">
    <img src="../examples/thumbs/space-invaders.png">
  </div>
  <div class="url">&#9656; <b>codeonline.io</b> &mdash; free, no install</div>
</body></html>
