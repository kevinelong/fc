name: checks

# The guards only help if they run. `node tools/checks.mjs` is one command that runs
# every harness and requires each one's summary line (a silent harness or a 0/0 run is
# a failure, not a pass), so CI needs no knowledge of the individual suites.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # apid's deps: the classroom, share-page and api guards start the real server.
      - name: apid dependencies
        run: cd apid && npm install --no-audit --no-fund

      # huntd's deps: the relay-limits guard starts the real relay.
      - name: huntd dependencies
        run: cd huntd && npm install --omit=dev --no-audit --no-fund

      # The pixel goldens drive the detected Chrome through playwright-core; without it
      # that check SKIPs by design, so CI installs it to keep the guard running. axe-core is
      # the same deal for the accessibility audit (it runs the structural pass without it).
      - name: browser-guard dependencies
        run: npm install --no-save --no-audit --no-fund playwright-core axe-core

      # The differentials compare against the wasm core, built here (target/ is ignored).
      - name: wasm core
        run: |
          rustup target add wasm32-unknown-unknown
          cd spec/port/spike && cargo build --release --target wasm32-unknown-unknown

      # Chrome is preinstalled on the runner and every other prerequisite is installed above,
      # so --strict: a SKIP here means the environment changed under a guard that then stopped
      # guarding (a dropped dependency, a renamed binary), and that is a failure, not a pass.
      - name: every harness
        run: node tools/checks.mjs --strict
